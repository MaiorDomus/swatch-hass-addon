name: Swatch
version: "3.2.11-local"
panel_icon: "mdi:palette"
panel_title: Swatch
slug: swatch
description: Detects known objects by color in camera images and sustained mechanical sounds (e.g. a kitchen hood fan) from camera audio.
url: "https://github.com/MaiorDomus/swatch"
startup: application
boot: auto
webui: "http://[HOST]:[PORT:4500]/"
ingress: false
ingress_port: 4500
ingress_entry: /
panel_admin: false
ports:
  4500/tcp: 4500
ports_description:
  4500/tcp: API
host_network: false
usb: false
tmpfs: true
full_access: false
environment:
  CONFIG_FILE: /config/swatch.yml
  MEDIA_DIR: /media/swatch
  DB_FILE: /media/swatch/swatch.db
options: {}
schema: {}
arch:
  - amd64
  - aarch64
map:
  - "media:rw"
  - type: homeassistant_config
    read_only: false
    path: /config
